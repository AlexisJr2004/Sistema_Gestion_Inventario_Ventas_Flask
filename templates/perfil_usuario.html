{% extends "base.html" %}
{% block title %}SGIV - Perfil de Usuario{% endblock %}

{% block content %}
<section class="bg-gradient-to-br from-brand-900 via-brand-800 to-brand-600 py-14">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-white">
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">Perfil de Usuario</h1>
        <p class="text-brand-100 mt-2">Gestiona tu perfil.</p>
    </div>
</section>

<section class="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 -mt-8 pb-16">
    <div class="bg-white rounded-2xl shadow-lg ring-1 ring-slate-100 p-6 sm:p-8 grid md:grid-cols-[16rem_1fr] gap-8">
        <div class="text-center">
            <h2 class="text-lg font-semibold text-slate-800 mb-5">Hola, {{ username }}!</h2>

            <div class="relative mx-auto mb-4 h-32 w-32">
                <img id="fotoPerfilPreview" alt="Imagen de perfil"
                     src="{% if imagen_base64 %}data:image/jpeg;base64,{{ imagen_base64 }}{% endif %}"
                     class="{% if not imagen_base64 %}hidden{% endif %} h-32 w-32 rounded-full object-cover ring-4 ring-brand-100">
                <div id="fotoPerfilPlaceholder" class="{% if imagen_base64 %}hidden{% endif %} h-32 w-32 rounded-full bg-slate-100 flex items-center justify-center ring-4 ring-slate-100">
                    <i class="ri-user-line text-5xl text-slate-400"></i>
                </div>
                <label for="imagenInput" title="Cambiar imagen"
                       class="absolute bottom-0 right-0 h-10 w-10 rounded-full bg-brand-600 hover:bg-brand-700 text-white flex items-center justify-center cursor-pointer shadow-lg ring-4 ring-white transition">
                    <i class="ri-camera-line"></i>
                </label>
            </div>

            <form id="formImagen" method="POST" enctype="multipart/form-data" class="space-y-3">
                <input type="file" id="imagenInput" name="imagen" accept="image/*" class="hidden"
                       onchange="previsualizarImagen(this, 'fotoPerfilPreview', 'fotoPerfilPlaceholder')">
                <p class="text-xs text-slate-400">Toca el ícono de cámara para elegir una foto</p>
                <div class="flex gap-2 justify-center">
                    <button type="button" class="inline-flex items-center gap-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white text-xs font-medium px-3 py-2 transition"
                            onclick="actualizarImagen(event)">
                        <i class="ri-upload-2-line"></i> Guardar
                    </button>
                    <button type="button" class="inline-flex items-center gap-1.5 rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-100 text-xs font-medium px-3 py-2 transition"
                            onclick="eliminarImagen('{{ username }}')">
                        <i class="ri-delete-bin-line"></i> Eliminar
                    </button>
                </div>
            </form>
        </div>

        <div>
            <form id="formPerfil" method="POST" class="grid sm:grid-cols-2 gap-5">
                <div class="sm:col-span-2">
                    <label class="flex items-center gap-2 rounded-xl bg-slate-50 border border-slate-200 px-3 py-2 mb-2">
                        <i class="ri-id-card-line text-slate-400"></i>
                        <span class="text-xs text-slate-400 uppercase tracking-wide">Nombre completo actual:</span>
                        <span class="text-sm text-slate-700 font-medium truncate">{{ datos_usuario[1] }}</span>
                    </label>
                    <div class="relative">
                        <i class="ri-edit-line absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="nuevo_nombre_completo" name="nuevo_nombre_completo"
                               placeholder="Nuevo nombre completo"
                               class="w-full rounded-xl border border-slate-200 pl-10 pr-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400 transition">
                    </div>
                </div>

                <div>
                    <label class="flex items-center gap-2 rounded-xl bg-slate-50 border border-slate-200 px-3 py-2 mb-2">
                        <i class="ri-file-user-line text-slate-400"></i>
                        <span class="text-sm text-slate-700 font-medium truncate">{{ datos_usuario[2] }}</span>
                    </label>
                    <div class="relative">
                        <i class="ri-edit-line absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="number" id="nueva_cedula" name="nueva_cedula"
                               placeholder="Nueva cédula"
                               class="w-full rounded-xl border border-slate-200 pl-10 pr-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400 transition">
                    </div>
                </div>

                <div>
                    <label class="flex items-center gap-2 rounded-xl bg-slate-50 border border-slate-200 px-3 py-2 mb-2">
                        <i class="ri-phone-line text-slate-400"></i>
                        <span class="text-sm text-slate-700 font-medium truncate">{{ datos_usuario[4] }}</span>
                    </label>
                    <div class="relative">
                        <i class="ri-edit-line absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="number" id="nuevo_celular" name="nuevo_celular"
                               placeholder="Nuevo celular"
                               class="w-full rounded-xl border border-slate-200 pl-10 pr-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400 transition">
                    </div>
                </div>

                <div class="sm:col-span-2">
                    <label class="flex items-center gap-2 rounded-xl bg-slate-50 border border-slate-200 px-3 py-2 mb-2">
                        <i class="ri-mail-line text-slate-400"></i>
                        <span class="text-sm text-slate-700 font-medium truncate">{{ datos_usuario[3] }}</span>
                    </label>
                    <div class="relative">
                        <i class="ri-edit-line absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="nuevo_correo" name="nuevo_correo"
                               placeholder="Nuevo correo electrónico"
                               class="w-full rounded-xl border border-slate-200 pl-10 pr-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400 transition">
                    </div>
                </div>

                <button type="button" class="sm:col-span-2 w-full inline-flex items-center justify-center gap-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white text-sm font-semibold py-2.5 transition shadow-lg shadow-brand-600/20"
                        onclick="actualizarPerfil(event)">
                    <i class="ri-save-line"></i> Actualizar Datos
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    function actualizarImagen(event) {
        event.preventDefault();
        var formData = new FormData(document.getElementById("formImagen"));
        var imagenInput = document.getElementById("imagenInput");

        if (!imagenInput.files.length || !imagenInput.value.trim()) {
            Swal.fire({
                icon: 'warning',
                title: 'Advertencia',
                text: 'Selecciona una imagen antes de actualizar.',
            });
            return;
        }

        fetch("/actualizar_imagen", {
            method: "POST",
            body: formData
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Éxito',
                        text: 'Imagen actualizada exitosamente.',
                        showCancelButton: false,
                        confirmButtonText: 'Continuar'
                    }).then((result) => {
                        if (result.isConfirmed) {
                            location.reload();
                        }
                    });
                }
            })
            .catch(error => console.error("Error:", error));
    }

    function eliminarImagen(username) {
        fetch('/eliminar_imagen_perfil', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({username: username})
        })
            .then(response => {
                if (response.ok) {
                    return response.json();
                } else {
                    throw new Error('No se pudo eliminar la imagen de perfil');
                }
            })
            .then(data => {
                if (data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Imagen eliminada',
                        text: 'La imagen de perfil ha sido eliminada exitosamente.',
                    }).then(() => {
                        location.reload();
                    });
                } else {
                    console.error('No se pudo eliminar la imagen de perfil:', data.message);
                }
            })
            .catch(error => {
                console.error('Error al eliminar la imagen de perfil:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Hubo un error al eliminar la imagen de perfil.',
                });
            });
    }
</script>

<script>
    function actualizarPerfil(event) {
        event.preventDefault();

        let nuevoNombreCompleto = document.getElementById('nuevo_nombre_completo').value.trim();
        let nuevaCedula = document.getElementById('nueva_cedula').value.trim();
        let nuevoCorreo = document.getElementById('nuevo_correo').value.trim();
        let nuevoCelular = document.getElementById('nuevo_celular').value.trim();

        if (nuevaCedula === '' || nuevoNombreCompleto === '' || nuevoCorreo === '' || nuevoCelular === '') {
            Swal.fire({
                icon: 'error',
                title: 'Oops...',
                text: 'Por favor, completa todos los campos',
            });
            return;
        }

        fetch('/actualizar_datos_usuario', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: new URLSearchParams({
                nuevo_nombre_completo: nuevoNombreCompleto,
                nueva_cedula: nuevaCedula,
                nuevo_correo: nuevoCorreo,
                nuevo_celular: nuevoCelular,
            }),
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    Swal.fire({
                        icon: 'success',
                        title: '¡Cambios realizados!',
                        text: 'Tus cambios se han guardado exitosamente.',
                    }).then(() => {
                        location.reload();
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: 'Hubo un error al guardar los cambios.',
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Error',
                    text: 'Hubo un error al procesar la solicitud.',
                });
            });
    }
</script>
{% endblock %}
