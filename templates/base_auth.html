<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SGIV{% endblock %}</title>

    <link href="{{ url_for('static', filename='assets/img/logo.png') }}" rel="icon">
    <link href="{{ url_for('static', filename='assets/img/logo.png') }}" rel="apple-touch-icon">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#eef1f9', 100: '#dde3f3', 200: '#b7c3e6', 300: '#8fa1d8',
                            400: '#5f78c2', 500: '#3d54a5', 600: '#2c3f87', 700: '#23336c',
                            800: '#1a2652', 900: '#131c3f', 950: '#0b1129',
                        },
                    },
                },
            },
        };
    </script>
    {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen flex flex-col font-sans bg-slate-50 relative overflow-x-hidden">

<div class="pointer-events-none fixed inset-0 overflow-hidden">
    <div class="absolute -top-32 -left-24 h-96 w-96 rounded-full bg-brand-200/50 blur-3xl"></div>
    <div class="absolute top-1/3 -right-24 h-96 w-96 rounded-full bg-indigo-200/50 blur-3xl"></div>
    <div class="absolute -bottom-32 left-1/4 h-96 w-96 rounded-full bg-sky-200/40 blur-3xl"></div>
</div>

<main class="relative z-10 flex-1 flex items-center justify-center px-4 py-12">
    {% block content %}{% endblock %}
</main>

<footer class="relative z-10 pb-6">
    <div class="max-w-3xl mx-auto px-4 flex flex-col sm:flex-row items-center justify-between gap-3">
        <p class="text-xs text-center sm:text-left text-slate-500">
            <strong class="text-slate-700">Universidad Estatal de Milagro</strong> · Todos los derechos reservados - UNEMI
        </p>
        <p class="flex items-center gap-2 text-xs font-mono tabular-nums bg-white border border-slate-200 text-slate-600 px-3 py-1.5 rounded-lg shadow-sm">
            <i class="ri-time-line"></i>
            <span id="time">--:--:--</span>
            <span id="ampm" class="text-brand-600">--</span>
        </p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="{{ url_for('static', filename='assets/js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
