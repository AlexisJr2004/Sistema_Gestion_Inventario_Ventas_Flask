{% extends "base_auth.html" %}
{% block title %}SGIV - Login{% endblock %}

{% block content %}
<div class="w-full max-w-md">
    <div class="bg-white/80 backdrop-blur-2xl rounded-3xl border border-white shadow-2xl shadow-slate-300/40 p-8 sm:p-10">
        <div class="flex flex-col items-center mb-6">
            <div class="h-16 w-16 rounded-2xl bg-brand-50 border border-brand-100 flex items-center justify-center mb-4">
                <img src="{{ url_for('static', filename='assets/img/logo.png') }}" alt="SGIV" class="h-10 w-10 rounded-xl">
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Iniciar Sesión</h1>
            <p class="text-sm text-slate-500 mt-1 text-center">Sistema de Gestión de Inventario y Ventas</p>
        </div>

        {% if error %}
        <div class="mb-4 flex items-center gap-2 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm px-3 py-2">
            <i class="ri-error-warning-line"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label for="username" class="block text-sm font-medium text-slate-600 mb-1">Nombre de usuario</label>
                <div class="relative">
                    <i class="ri-user-3-line absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" id="username" name="username" required
                           class="w-full rounded-xl bg-white border border-slate-200 pl-10 pr-3 py-2.5 text-sm text-slate-800 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400 transition">
                </div>
            </div>

            <div>
                <label for="password" class="block text-sm font-medium text-slate-600 mb-1">Contraseña</label>
                <div class="relative">
                    <i class="ri-lock-2-line absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="password" id="password" name="password" required
                           class="w-full rounded-xl bg-white border border-slate-200 pl-10 pr-10 py-2.5 text-sm text-slate-800 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400 transition">
                    <button type="button" id="togglePassword" class="absolute inset-y-0 right-0 flex items-center px-3 text-slate-400 hover:text-slate-600 transition">
                        <i class="ri-eye-line" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="w-full flex items-center justify-center gap-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm py-3 transition shadow-lg shadow-brand-600/20">
                <i class="ri-login-box-line"></i> Iniciar Sesión
            </button>
        </form>

        <div class="flex items-center gap-3 my-5">
            <div class="h-px flex-1 bg-slate-200"></div>
            <span class="text-xs text-slate-400">o</span>
            <div class="h-px flex-1 bg-slate-200"></div>
        </div>

        <form action="{{ url_for('registro_usuarios') }}" method="POST">
            <button type="submit" class="w-full flex items-center justify-center gap-2 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50 font-medium text-sm py-2.5 transition">
                <i class="ri-user-add-line"></i> Regístrate
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const togglePassword = document.querySelector('#togglePassword');
    const password = document.querySelector('#password');
    const togglePasswordIcon = document.querySelector('#togglePasswordIcon');

    togglePassword.addEventListener('click', function () {
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        togglePasswordIcon.classList.toggle('ri-eye-line');
        togglePasswordIcon.classList.toggle('ri-eye-off-line');
    });
</script>
{% endblock %}
