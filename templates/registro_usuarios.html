{% extends "base_auth.html" %}
{% block title %}SGIV - Registro de Usuario{% endblock %}

{% block extra_head %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.12/css/intlTelInput.css">
{% endblock %}

{% block content %}
<div class="w-full max-w-2xl">
    <div class="bg-white/80 backdrop-blur-2xl rounded-3xl border border-white shadow-2xl shadow-slate-300/40 p-8 sm:p-10">
        <div class="flex flex-col items-center mb-6">
            <div class="h-16 w-16 rounded-2xl bg-brand-50 border border-brand-100 flex items-center justify-center mb-4">
                <img src="{{ url_for('static', filename='assets/img/logo.png') }}" alt="SGIV" class="h-10 w-10 rounded-xl">
            </div>
            <h1 class="text-2xl font-bold text-slate-800">Registro de Clientes</h1>
            <p class="text-sm text-slate-500 mt-1 text-center">Crea tu cuenta para acceder al sistema</p>
        </div>

        {% if error %}
        <div class="mb-4 flex items-center gap-2 rounded-xl bg-rose-50 border border-rose-200 text-rose-700 text-sm px-3 py-2">
            <i class="ri-error-warning-line"></i>
            <span>{{ error }}</span>
        </div>
        {% endif %}

        <form id="registroForm" action="/registro_usuario" method="POST" enctype="multipart/form-data" class="grid sm:grid-cols-2 gap-4">
            <div>
                <label for="nombre" class="block text-sm font-medium text-slate-600 mb-1">Nombre de usuario</label>
                <div class="relative">
                    <i class="ri-user-3-line absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" class="w-full rounded-xl bg-white border border-slate-200 pl-10 pr-3 py-2.5 text-sm text-slate-800 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400 transition" id="nombre" name="nombre" required>
                </div>
            </div>
            <div>
                <label for="correo" class="block text-sm font-medium text-slate-600 mb-1">Correo</label>
                <div class="relative">
                    <i class="ri-mail-line absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="email" class="w-full rounded-xl bg-white border border-slate-200 pl-10 pr-3 py-2.5 text-sm text-slate-800 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400 transition" id="correo" name="correo" required>
                </div>
            </div>

            <div>
                <label for="nombre_completo" class="block text-sm font-medium text-slate-600 mb-1">Nombre completo</label>
                <div class="relative">
                    <i class="ri-id-card-line absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="text" class="w-full rounded-xl bg-white border border-slate-200 pl-10 pr-3 py-2.5 text-sm text-slate-800 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400 transition" id="nombre_completo" name="nombre_completo" required>
                </div>
            </div>
            <div>
                <label for="celular" class="block text-sm font-medium text-slate-600 mb-1">Celular</label>
                <div class="relative">
                    <i class="ri-phone-line absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="number" id="celular" name="celular" class="w-full rounded-xl bg-white border border-slate-200 pl-10 pr-3 py-2.5 text-sm text-slate-800 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400 transition" required
                           pattern="[0-9]*" inputmode="numeric" maxlength="11">
                </div>
            </div>

            <div>
                <label for="cedula" class="block text-sm font-medium text-slate-600 mb-1">Cédula</label>
                <div class="relative">
                    <i class="ri-file-user-line absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="number" class="w-full rounded-xl bg-white border border-slate-200 pl-10 pr-3 py-2.5 text-sm text-slate-800 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400 transition" id="cedula" name="cedula" required
                           pattern="[0-9]*" inputmode="numeric" maxlength="10">
                </div>
            </div>
            <div>
                <label for="contrasena" class="block text-sm font-medium text-slate-600 mb-1">Contraseña</label>
                <div class="relative">
                    <i class="ri-lock-2-line absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="password" class="w-full rounded-xl bg-white border border-slate-200 pl-10 pr-3 py-2.5 text-sm text-slate-800 placeholder-slate-300 focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400 transition" id="contrasena" name="contrasena" required>
                </div>
            </div>

            <div class="sm:col-span-2 flex flex-col gap-2 mt-2">
                <button type="button" class="w-full flex items-center justify-center gap-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm py-3 transition shadow-lg shadow-brand-600/20" onclick="registrarUsuario()">
                    <i class="ri-user-add-line"></i> Registrar usuario
                </button>
                <button type="button" class="w-full flex items-center justify-center gap-2 rounded-xl border border-slate-200 text-slate-700 hover:bg-slate-50 font-medium text-sm py-2.5 transition" onclick="volver()">
                    <i class="ri-arrow-left-line"></i> Regresar
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.12/js/intlTelInput.min.js"></script>
<script>
    var input = document.querySelector("#celular");

    var inputObject = window.intlTelInput(input, {
        initialCountry: "ec",
        separateDialCode: true,
        utilsScript: "https://cdnjs.cloudflare.com/ajax/libs/intl-tel-input/17.0.12/js/utils.js",
        onlyCountries: ['ec', 'us', 'ca', 'mx', 'ar', 'br', 'cl', 'pe'],
        nationalMode: false,
    });

    var form = document.querySelector('#registroForm');
    form.addEventListener('submit', function (event) {
        var countryCode = inputObject.getSelectedCountryData().dialCode;
        var phoneNumber = input.value;
        input.value = "+" + countryCode + phoneNumber;
    });

    input.addEventListener('input', function () {
        if (input.value.length > 10) {
            input.value = input.value.slice(0, 10);
        }
    });

    function volver() {
        window.location.href = '/login';
    }

    function registrarUsuario() {
        const form = document.getElementById('registroForm');
        const formData = new FormData(form);

        fetch('/registro_usuario', {
            method: 'POST',
            body: formData,
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    Swal.fire({
                        title: '¡Usuario registrado!',
                        text: data.message,
                        icon: 'success',
                        confirmButtonColor: '#2c3f87',
                        confirmButtonText: 'OK'
                    }).then(() => {
                        window.location.href = '/';
                    });
                } else {
                    Swal.fire({
                        title: 'Error al registrar',
                        text: data.message,
                        icon: 'error',
                        confirmButtonColor: '#d33',
                        confirmButtonText: 'OK'
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
    }
</script>
{% endblock %}
