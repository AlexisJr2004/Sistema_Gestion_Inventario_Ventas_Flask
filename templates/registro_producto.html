{% extends "base.html" %}
{% block title %}SGIV - Registro de Productos{% endblock %}

{% block content %}
<section class="bg-gradient-to-br from-brand-900 via-brand-800 to-brand-600 py-14">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-white">
        <h1 class="text-3xl sm:text-4xl font-extrabold tracking-tight">Registro de Productos</h1>
        <p class="text-brand-100 mt-2">Completa el formulario para agregar nuevos productos a la tienda.</p>
    </div>
</section>

<section class="max-w-3xl mx-auto px-4 sm:px-6 lg:px-8 -mt-8 pb-16">
    <div class="bg-white rounded-2xl shadow-lg ring-1 ring-slate-100 p-6 sm:p-8">
        <form action="/registrar_producto" method="POST" enctype="multipart/form-data" class="grid sm:grid-cols-[10rem_1fr] gap-6">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Imagen</label>
                <label for="imagen"
                       class="group relative flex flex-col items-center justify-center h-40 w-40 rounded-2xl border-2 border-dashed border-slate-300 hover:border-brand-400 bg-slate-50 hover:bg-brand-50/40 transition cursor-pointer overflow-hidden">
                    <img id="previewImagenProducto" alt="Vista previa" class="hidden absolute inset-0 h-full w-full object-cover">
                    <div id="previewImagenProductoPlaceholder" class="flex flex-col items-center gap-1.5 text-slate-400 group-hover:text-brand-500 transition px-2 text-center">
                        <i class="ri-image-add-line text-3xl"></i>
                        <span class="text-xs font-medium">Subir imagen</span>
                        <span class="text-[10px] text-slate-300">Opcional</span>
                    </div>
                    <input type="file" id="imagen" name="imagen" accept="image/*" class="hidden"
                           onchange="previsualizarImagen(this, 'previewImagenProducto', 'previewImagenProductoPlaceholder')">
                </label>
            </div>

            <div class="space-y-4">
                <div>
                    <label for="nombre" class="block text-sm font-medium text-slate-600 mb-1">Nombre del Producto</label>
                    <div class="relative">
                        <i class="ri-price-tag-3-line absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="nombre" name="nombre" required
                               class="w-full rounded-xl border border-slate-200 pl-10 pr-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400 transition">
                    </div>
                </div>

                <div>
                    <label for="categoria" class="block text-sm font-medium text-slate-600 mb-1">Categoría</label>
                    <div class="relative">
                        <i class="ri-folder-3-line absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                        <input type="text" id="categoria" name="categoria" required
                               class="w-full rounded-xl border border-slate-200 pl-10 pr-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400 transition">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label for="precio" class="block text-sm font-medium text-slate-600 mb-1">Precio</label>
                        <div class="relative">
                            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400 text-sm">$</span>
                            <input type="number" id="precio" name="precio" step="0.01" required
                                   class="w-full rounded-xl border border-slate-200 pl-7 pr-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400 transition">
                        </div>
                    </div>
                    <div>
                        <label for="cantidad" class="block text-sm font-medium text-slate-600 mb-1">Cantidad</label>
                        <div class="relative">
                            <i class="ri-stack-line absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                            <input type="number" id="cantidad" name="cantidad" required
                                   class="w-full rounded-xl border border-slate-200 pl-10 pr-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-brand-400 focus:border-brand-400 transition">
                        </div>
                    </div>
                </div>
            </div>

            <div class="sm:col-span-2 flex flex-col sm:flex-row gap-3 pt-2 border-t border-slate-100">
                <button type="submit" name="action" value="registrar" onclick="confirmarRegistro()"
                        class="flex-1 inline-flex items-center justify-center gap-2 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm py-2.5 transition shadow-lg shadow-brand-600/20 mt-4">
                    <i class="ri-add-circle-line"></i> Registrar Producto
                </button>
            </div>
        </form>

        <div class="flex flex-col sm:flex-row gap-3 mt-4">
            <form action="{{ url_for('gestion_inventario') }}" method="GET" class="flex-1">
                <button type="submit" class="w-full inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 text-sm font-medium py-2.5 transition">
                    <i class="ri-archive-line"></i> Ir al Inventario
                </button>
            </form>
            <form action="{{ url_for('index') }}" method="GET">
                <button type="submit" class="w-full inline-flex items-center justify-center gap-2 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 text-sm font-medium py-2.5 px-4 transition">
                    <i class="ri-home-4-line"></i>
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script>
    function confirmarRegistro() {
        Swal.fire({
            title: '¡Producto registrado!',
            text: 'El producto se ha registrado exitosamente.',
            icon: 'success',
            confirmButtonColor: '#2c3f87',
            confirmButtonText: 'OK'
        });
    }
</script>
{% endblock %}
